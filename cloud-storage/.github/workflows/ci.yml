name: CI

on:
  push:
    branches: [main]
    paths:
      - 'cloud-storage/**'
  pull_request:
    branches: [main]
    paths:
      - 'cloud-storage/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-storage/vulnerable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v

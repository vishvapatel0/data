name: CI

on:
  push:
    branches: [main]
    paths:
      - 'rideshare-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'rideshare-api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rideshare-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rideshare-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit || true

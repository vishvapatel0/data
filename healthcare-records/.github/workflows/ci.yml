name: CI

on:
  push:
    branches: [main]
    paths:
      - 'healthcare-records/**'
  pull_request:
    branches: [main]
    paths:
      - 'healthcare-records/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-records/app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-records/app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit || true

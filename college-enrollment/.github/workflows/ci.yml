name: CI

on:
  push:
    branches: [main]
    paths:
      - 'college-enrollment/**'
  pull_request:
    branches: [main]
    paths:
      - 'college-enrollment/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: college-enrollment

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest enrollment/tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: college-enrollment

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt || true
